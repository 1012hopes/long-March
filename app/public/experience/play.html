<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>长征一条路的来处 · 走进三十一站</title>
<style>
  :root{
    --ink:#f4eee4;
    --dim:rgba(244,238,228,.62);
    --dim2:rgba(244,238,228,.38);
    --red:#c0392b;
    --gold:#d9b678;
    --line:rgba(244,238,228,.15);
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",SimSun,serif;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#07080a}
  body{font-family:var(--sans);color:var(--ink);user-select:none}

  /* ---------- 底图 ---------- */
  /* 不是把一张图在平面上推来推去，是把它搁进一个有景深的空间里：
     #stageOuter 给出透视距离，#stage 是那台相机 ——
     平移之外还能左右转、上下点头；远近几层各自以不同速度摆动。 */
  /* 透视原点必须正好在视口中心 —— 热点是用同一套公式投上去的，
     原点偏一点，点头的时候点就会从人身上滑开。 */
  #stageOuter{position:fixed;inset:0;z-index:0;overflow:hidden;background:#07080a;
    perspective:880px;perspective-origin:50% 50%}
  #stage{position:absolute;inset:0;transform-origin:50% 50%;
    transform-style:preserve-3d;will-change:transform}
  #bgWrap{position:absolute;inset:0;overflow:hidden;background:#07080a;
    transform:translateZ(0);backface-visibility:hidden}

  /* 一层远、一层近，z 拉开。正视时各层像素与底图重合，一进来画面是干净的；
     一转视角，远的走得慢、近的走得快 —— 眼睛就把它读成一个空间，而不是一张纸。 */
  #depthA{position:absolute;inset:0;background-repeat:no-repeat;
    background-color:#07080a;pointer-events:none;will-change:transform;
    opacity:0;transition:opacity .7s ease}
  /* 只在站着看的时候才开。剧情模式下底图还在慢慢推近，
     这层要是也跟着露脸，就会跟底图错开成重影。 */
  body.explore #depthA,
  body.explore #paneFar{opacity:1}
  /* 远：天、山、屋脊。摆幅最小，还要轻微发灰发虚 —— 空气隔在中间。
     只留上半一条：远处的东西低反差，错开一点眼睛读成雾，不会读成重影。
     近处那两层（脚底、两侧墙）试过了 —— 同一张图错开就是「双影」，
     不是纵深：真实视差会露出后面的东西，复制只会让同一件东西出现两次。 */
  #depthA{transform:translateZ(-620px) scale(1.7045);
    filter:brightness(1.05) blur(.6px);
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 26%,rgba(0,0,0,.55) 42%,rgba(0,0,0,0) 56%);
    mask-image:linear-gradient(180deg,#000 0%,#000 26%,rgba(0,0,0,.55) 42%,rgba(0,0,0,0) 56%)}
  /* 近：不是再抄一张图，是一圈「身前的东西」—— 门框、檐影、贴着脸的暗。
     它是渐变，不是画，所以怎么错开都不会出双影；可它摆幅最大，
     一转视角，画面四周就带着劲扫过去，眼睛立刻知道「有东西在我前头」。 */
  #paneNear{position:absolute;left:-22%;top:-22%;width:144%;height:144%;
    pointer-events:none;opacity:0;transition:opacity .8s ease;
    background:
      radial-gradient(ellipse 74% 70% at 50% 52%,rgba(3,4,7,0) 42%,
        rgba(3,4,7,.42) 74%,rgba(3,4,7,.80) 96%,rgba(3,4,7,.90) 100%)}
  body.explore #paneNear{opacity:1}
  /* 分层复制的必须和原图逐像素对得上，所以探索时把缓慢推近关掉 */
  body.explore .bg.pan{animation:none;transform:scale(1)}

  /* 远雾：z 在很后面，转头时几乎不动 —— 空气把远山隔开一层。
     只让它出现在画面的上半（那里才是远的），下半用遮罩吃掉。 */
  #paneFar{position:absolute;left:-26%;top:-26%;width:152%;height:152%;
    transform:translateZ(-760px) scale(1.76);pointer-events:none;
    opacity:0;transition:opacity .7s ease;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.74) 26%,
      rgba(0,0,0,.22) 48%,rgba(0,0,0,0) 62%);
    mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.74) 26%,
      rgba(0,0,0,.22) 48%,rgba(0,0,0,0) 62%);
    background:
      radial-gradient(ellipse 62% 38% at 50% 26%,rgba(214,222,230,.17),rgba(214,222,230,0) 72%),
      linear-gradient(180deg,rgba(222,228,234,.20) 0%,rgba(198,207,216,.12) 24%,
        rgba(176,186,200,.045) 44%,rgba(160,170,184,0) 58%)}
  /* 近景那一层不画了：暗场里黑剪影看不见，亮场里又挡画面。
     纵深交给上面那两层真实的视差。 */
  @media (max-width:720px){
    #stageOuter{perspective:720px}
  }

  /* ---------- 柱面世界 ----------
     一张照片的边就是世界的边，所以怎么看都像照片。
     这里把宽景图贴到一个圆筒的内壁上，人站在轴上：转视角＝圆筒绕人转，
     往左能看见门外的院子和谷架，往右能看见灶和柴堆，边上永远是墙不是空。
     圆筒由 pano.js 生成，N 块竖板真拼成，不是假的左右平移。 */
  #panoRoot{position:absolute;inset:0;transform-style:preserve-3d;
    pointer-events:none;opacity:0;transition:opacity .9s ease}
  body.pano #panoRoot{opacity:1}
  /* 圆筒是 WebGL 一次画出来的，画布铺满整个视口 */
  #panoRoot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #panoRoot .pn{position:absolute;left:50%;top:50%;
    background-repeat:no-repeat;background-color:#0a0b0e;backface-visibility:hidden}
  /* 有圆筒的时候，平面那几层全部退场 —— 留着就是两张画叠在一起 */
  body.pano #bgWrap,body.pano #depthA,body.pano #paneFar{opacity:0!important}
  /* 圆筒是 WebGL 一次画满整屏的，`#paneNear` 那圈「近处暗框」在这里
     没有对应物 —— 留着就是四条黑边，视野一宽立刻看得见。 */
  body.pano #paneNear{opacity:0}
  /* 进了屋子，下半屏不能再当电影银幕压黑。
     #shade 底下那一段是 .93→.985 的黑，低头看地的时候，
     地面、门槛、水缸、柴堆全在这条黑带底下 —— 人判断「这是一间屋」
     靠的正是脚下，压掉它就只剩一张挂在眼前的画。
     这里换成一圈很轻的边：上面留屋脊压暗，下面只留一点点接地阴影。 */
  body.pano #shade{background:
      radial-gradient(ellipse at 24% 26%,rgba(0,0,0,.24),rgba(0,0,0,0) 62%),
      linear-gradient(180deg,rgba(6,7,9,.44) 0%,rgba(6,7,9,.02) 22%,
        rgba(6,7,9,.04) 54%,rgba(6,7,9,.16) 86%,rgba(6,7,9,.34) 100%)}
  body.pano #vig{background:
      radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 46%,
        rgba(0,0,0,.26) 84%,rgba(0,0,0,.48) 100%)}
  .bg{position:absolute;inset:0;background-repeat:no-repeat;background-color:#07080a;
    opacity:0;transition:opacity 1.3s ease;will-change:opacity,transform}
  .bg.on{opacity:1}
  .bg.pan{animation:pan 46s linear forwards}
  @keyframes pan{from{transform:scale(1.02)}to{transform:scale(1.13)}}

  /* 底图上本来就画着人。把这些人的那一块底图单独重绘一遍、
     只做一两像素的位移 —— 眼睛读到的就是他在呼吸，或者他在走。
     幅度必须小：超过 4px 就变成整块画面在抖。 */
  .bg .bb{position:absolute;inset:0;background-repeat:no-repeat;
    pointer-events:none;will-change:transform}
  .bb.breathe{animation:bbBreathe var(--dur,5s) ease-in-out infinite;
    animation-delay:var(--dly,0s)}
  @keyframes bbBreathe{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(var(--sway,0px),calc(-1 * var(--amp,1.6px)),0) scale(var(--sc,1.0006))}
  }
  .bb.step{animation:bbStep var(--dur,1.1s) ease-in-out infinite;
    animation-delay:var(--dly,0s)}
  @keyframes bbStep{
    0%,100%{transform:translate3d(0,0,0)}
    25%{transform:translate3d(0.7px,calc(-1 * var(--amp,2.4px)),0)}
    50%{transform:translate3d(0,0,0)}
    75%{transform:translate3d(-0.7px,calc(-1 * var(--amp,2.4px)),0)}
  }
  .bb.strain{animation:bbStrain var(--dur,2.6s) ease-in-out infinite;
    animation-delay:var(--dly,0s)}
  @keyframes bbStrain{
    0%,100%{transform:translate3d(0,0,0)}
    18%{transform:translate3d(0.5px,calc(-1 * var(--amp,2.2px)),0)}
    34%{transform:translate3d(-0.4px,0,0)}
    62%{transform:translate3d(0.3px,calc(-1 * var(--amp,1.7px)),0)}
  }
  @media (prefers-reduced-motion: reduce){
    .bb{animation:none!important}
  }
  #tint{position:fixed;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:1}
  #shade{position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse at 22% 30%,rgba(0,0,0,.30),rgba(0,0,0,0) 60%),
      linear-gradient(180deg,rgba(6,7,9,.72) 0%,rgba(6,7,9,.10) 26%,rgba(6,7,9,.34) 52%,rgba(6,7,9,.93) 84%,rgba(6,7,9,.985) 100%)}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 34%,rgba(0,0,0,.52) 82%,rgba(0,0,0,.8) 100%)}
  #grain{position:fixed;inset:-20%;pointer-events:none;opacity:.055;z-index:5;
    background-repeat:repeat;animation:gr .7s steps(3) infinite}
  /* 圆筒本身已经是 4096 的实拍纹理，再压一层噪点只会把细节搅浑 ——
     平面底图需要它来「去数码感」，这里不需要。 */
  body.pano #grain{opacity:.026}
  @keyframes gr{0%{transform:translate(0,0)}33%{transform:translate(-2%,1%)}66%{transform:translate(1%,-2%)}100%{transform:translate(0,0)}}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:0;background:#fff}
  #flash.go{animation:fl .75s ease-out}
  @keyframes fl{0%{opacity:.92}100%{opacity:0}}
  body.shake #stage,body.shake #deck{animation:sk .42s cubic-bezier(.36,.07,.19,.97)}
  @keyframes sk{10%{transform:translate(-5px,2px)}30%{transform:translate(4px,-3px)}50%{transform:translate(-3px,1px)}70%{transform:translate(2px,2px)}100%{transform:none}}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:20}
  .hud-l{position:absolute;left:clamp(16px,3.2vw,42px);top:clamp(15px,2.8vw,32px)}
  .hud-l::before{content:"";position:absolute;left:-70px;top:-48px;width:460px;height:230px;
    background:radial-gradient(ellipse at 28% 34%,rgba(0,0,0,.66),rgba(0,0,0,.24) 48%,rgba(0,0,0,0) 76%);z-index:-1}
  .hud-l .t{font-family:var(--serif);font-size:clamp(13px,1.2vw,16px);letter-spacing:.16em;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.95),0 2px 16px rgba(0,0,0,.9)}
  .hud-l .p{margin-top:7px;font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.6);
    text-shadow:0 1px 8px rgba(0,0,0,.95)}
  .hud-l .d{margin-top:11px;font-size:11.5px;letter-spacing:.14em;color:rgba(255,255,255,.82);
    text-shadow:0 1px 8px rgba(0,0,0,.95);font-variant-numeric:tabular-nums}
  .hud-l .d.walk{margin-top:5px;font-size:10.5px;letter-spacing:.12em;color:rgba(255,255,255,.58)}
  #hPanoCredit{display:none}
  body.pano #hPanoCredit{display:block}
  #hTag{display:none;margin-left:9px;font-size:9.5px;letter-spacing:.2em;font-style:normal;
    color:rgba(217,182,120,.95);border:1px solid rgba(217,182,120,.45);border-radius:2px;
    padding:2px 6px;vertical-align:2px}
  #hTag.on{display:inline-block}
  #mate{margin-top:11px;font-family:var(--serif);font-size:11.5px;line-height:1.85;letter-spacing:.05em;
    color:rgba(255,240,220,.60);text-shadow:0 1px 8px rgba(0,0,0,.95);
    max-width:min(390px,62vw);opacity:0;transition:opacity .55s}
  #mate.on{opacity:1}
  #mate b{color:rgba(217,182,120,.92);font-weight:500;letter-spacing:.16em;margin-right:7px}
  .hud-r{position:absolute;right:clamp(14px,3vw,40px);top:clamp(14px,2.8vw,30px);display:flex;gap:8px;pointer-events:auto}
  .hud-r button{font:inherit;font-size:11.5px;letter-spacing:.13em;color:var(--dim);cursor:pointer;
    background:rgba(10,12,15,.46);border:1px solid var(--line);border-radius:2px;padding:7px 12px;
    backdrop-filter:blur(8px);transition:.2s;white-space:nowrap}
  .hud-r button:hover{color:var(--ink);border-color:rgba(244,238,228,.42)}
  .hud-r button b{color:var(--gold);font-weight:500;font-variant-numeric:tabular-nums}
  .hud-r button.pulse{animation:bp 1.6s ease-out 2}
  @keyframes bp{0%,100%{border-color:var(--line)}45%{border-color:rgba(217,182,120,.85);box-shadow:0 0 0 3px rgba(217,182,120,.12)}}

  /* ---------- 体力 / 状态 ---------- */
  #stam{position:static;margin-top:13px;display:flex;align-items:center;gap:9px;
    font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.5);
    text-shadow:0 1px 8px rgba(0,0,0,.95)}
  #stamBarWrap{width:104px;height:3px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
  #stamBar{position:absolute;inset:0;transform-origin:left center;
    background:linear-gradient(90deg,rgba(192,57,43,.72),#d0574a);transition:transform .5s cubic-bezier(.4,0,.2,1)}
  #stamNum{font-variant-numeric:tabular-nums;letter-spacing:.1em}
  #stam.low #stamBar{background:linear-gradient(90deg,#a8281c,#e0563f);animation:lowp 1.6s ease-in-out infinite}
  @keyframes lowp{0%,100%{opacity:1}50%{opacity:.45}}
  #flags{position:static;margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;max-width:min(360px,50vw)}
  #flags span{font-size:10px;letter-spacing:.1em;color:rgba(255,246,232,.78);
    border:1px solid rgba(255,245,230,.18);background:rgba(6,8,11,.4);border-radius:2px;padding:3px 7px;
    backdrop-filter:blur(4px)}
  #flags:empty{display:none}

  /* ---------- 正文 + 选项 ---------- */
  #deck{position:fixed;left:0;right:0;bottom:0;z-index:22;
    padding:0 clamp(18px,6vw,96px) clamp(40px,6vh,62px);
    max-width:min(820px,94vw);pointer-events:none;transition:opacity .6s}
  #text{font-family:var(--serif);font-size:clamp(16px,1.5vw,19px);line-height:2.16;letter-spacing:.045em;
    color:rgba(248,243,234,.95);text-shadow:0 1px 20px rgba(0,0,0,.95),0 0 44px rgba(0,0,0,.6);
    min-height:1.2em;pointer-events:auto}
  #text p{margin:0 0 .68em}
  #text p:last-child{margin-bottom:0}
  #text .say{color:#e8cfa2;letter-spacing:.06em}
  #text .big{font-size:1.16em;color:#fff}
  #text .cue{display:inline-block;width:7px;height:1.02em;background:rgba(244,238,228,.8);
    vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  #choices{margin-top:clamp(16px,2.4vh,26px);display:flex;flex-direction:column;gap:1px;
    pointer-events:auto;max-width:min(640px,100%)}
  .ch{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;font:inherit;cursor:pointer;
    background:linear-gradient(90deg,rgba(8,10,13,.78),rgba(8,10,13,.30));
    border:0;border-left:2px solid rgba(244,238,228,.22);color:rgba(246,241,232,.92);
    padding:13px 16px 13px 14px;font-size:clamp(14px,1.28vw,15.6px);line-height:1.72;letter-spacing:.04em;
    transition:.18s;opacity:0;transform:translateY(6px);backdrop-filter:blur(6px)}
  .ch.in{opacity:1;transform:none;transition:opacity .42s,transform .42s,border-color .18s,background .18s,color .18s}
  .ch .n{font-family:var(--serif);font-size:12px;color:rgba(217,182,120,.9);letter-spacing:.1em;
    padding-top:2px;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .ch .t{flex:1}
  .ch .c{flex:0 0 auto;font-size:10px;letter-spacing:.08em;color:rgba(214,120,100,.95);padding-top:6px}
  .ch:hover,.ch:focus-visible{outline:0;border-left-color:var(--red);color:#fff;
    background:linear-gradient(90deg,rgba(30,22,22,.92),rgba(10,12,15,.5));transform:translateX(4px)}
  .ch.lock{cursor:not-allowed;color:rgba(244,238,228,.34);border-left-color:rgba(244,238,228,.08)}
  .ch.lock:hover{transform:none;background:linear-gradient(90deg,rgba(10,12,15,.55),rgba(10,12,15,.2))}
  .ch.lock .t em{font-style:normal;color:rgba(214,120,100,.7);font-size:11.5px;letter-spacing:.06em}
  .ch.stay{background:none;border-left-color:rgba(244,238,228,.08);color:rgba(244,238,228,.42);
    font-size:12.5px;padding:9px 16px 9px 14px;margin-top:2px;backdrop-filter:none}
  .ch.stay .n{color:rgba(244,238,228,.28)}
  .ch.stay:hover{color:rgba(244,238,228,.78);border-left-color:rgba(192,57,43,.5);
    background:linear-gradient(90deg,rgba(30,22,22,.55),rgba(10,12,15,.2))}

  /* ---------- 决断：按下去的那一下 ---------- */
  .ch.act{transform:translateX(9px);border-left-color:#e9c78a;color:#fff;
    background:linear-gradient(90deg,rgba(58,42,26,.94),rgba(12,14,17,.62));
    box-shadow:0 0 0 1px rgba(233,199,138,.26),0 10px 34px -14px rgba(233,199,138,.42);
    transition:transform .3s cubic-bezier(.2,.8,.3,1),border-color .22s,
      background .22s,color .22s,box-shadow .3s}
  .ch.act .n{color:#f2ddb4}
  .ch.away{opacity:0;transform:translateY(-7px);
    transition:opacity .26s ease,transform .26s ease}
  #choices.fold{pointer-events:none;animation:chFold .36s cubic-bezier(.3,.72,.3,1) forwards}
  @keyframes chFold{
    0%{opacity:1;transform:none}
    26%{opacity:1;transform:translateY(3px)}
    100%{opacity:0;transform:translateY(-12px)}
  }
  /* 收拢的时候，被按下去的那一条是往下沉的，不是跟着往上飘 */
  #choices.fold .ch.act{transform:translate(9px,17px)}

  /* 选择之后，镜头往前倾一下 —— 像人迈了半步，又站住 */
  #bgWrap.lurch{animation:lurch .92s cubic-bezier(.25,.9,.3,1)}
  @keyframes lurch{
    0%{transform:scale(1)}
    26%{transform:scale(1.018) translate3d(-0.22%,-0.26%,0)}
    58%{transform:scale(1.004) translate3d(0.08%,0.07%,0)}
    100%{transform:scale(1)}
  }

  /* 行程钟走了一格 */
  #hClock.bump{animation:ck .5s ease-out}
  @keyframes ck{0%{color:#e9c78a;transform:translateY(-1px)}100%{color:inherit;transform:none}}

  @media (prefers-reduced-motion: reduce){
    #bgWrap.lurch{animation:none}
    .ch.act{transform:none}
    #hClock.bump{animation:none}
  }

  /* ---------- 抽屉 ---------- */
  #drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);z-index:60;
    background:linear-gradient(180deg,rgba(12,14,17,.975),rgba(9,11,14,.99));
    border-left:1px solid var(--line);padding:clamp(26px,4vw,44px) clamp(20px,3vw,32px);
    overflow-y:auto;transform:translateX(101%);transition:transform .42s cubic-bezier(.4,0,.2,1);
    backdrop-filter:blur(16px)}
  #drawer.on{transform:none}
  #drClose{position:absolute;right:14px;top:12px;width:34px;height:34px;font-size:20px;line-height:1;
    color:var(--dim);background:none;border:0;cursor:pointer}
  #drClose:hover{color:var(--ink)}
  #drHead{font-family:var(--serif);font-size:clamp(17px,2vw,21px);letter-spacing:.1em;margin:0 0 4px}
  #drSub{font-size:11px;letter-spacing:.16em;color:var(--dim2);margin-bottom:22px}
  .nt{border-top:1px solid var(--line);padding:18px 0}
  .nt:first-of-type{border-top:0;padding-top:0}
  .nt .lv{display:inline-block;font-size:9.5px;letter-spacing:.2em;padding:3px 8px;border-radius:2px;
    border:1px solid rgba(200,168,110,.45);color:var(--gold);margin-bottom:10px}
  .nt .lv.approximate{border-color:rgba(120,170,200,.45);color:#8fb6cd}
  .nt h4{font-family:var(--serif);font-size:15.5px;margin:0 0 10px;color:#fff;letter-spacing:.03em;font-weight:600}
  .nt summary{font-family:var(--serif);font-size:15.5px;line-height:1.5;color:#fff;cursor:pointer}
  .nt[open] summary{margin-bottom:10px}
  .drCast button{display:block;width:100%;text-align:left;border:1px solid var(--line);
    background:transparent;color:var(--ink);font:inherit;margin-top:6px;padding:8px 12px;cursor:pointer}
  .drCast button:hover{border-color:var(--gold)}
  .nt .b{font-size:12.5px;line-height:1.95;color:rgba(244,238,228,.78)}
  .nt .b b{color:#fff;font-weight:600}
  .nt .s{margin-top:12px;font-size:11px;line-height:1.85;color:var(--dim2);border-top:1px solid var(--line);padding-top:10px}
  .nt .s b{color:rgba(217,182,120,.95);font-weight:500}
  .nt .w{margin-top:9px;font-size:10.5px;line-height:1.8;color:rgba(210,150,120,.75);
    padding-left:10px;border-left:2px solid rgba(192,90,60,.4)}
  #drEmpty{font-size:12.5px;line-height:2;color:var(--dim2)}

  /* ---------- 开场 / 结局 ---------- */
  .veil{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:clamp(20px,4vw,44px);
    overflow-y:auto;transition:opacity .9s,visibility .9s}
  .veil.gone{opacity:0;visibility:hidden;pointer-events:none}
  #intro{background:radial-gradient(ellipse at 46% 42%,rgba(6,7,9,.58),rgba(4,5,7,.95))}
  #intro .box{max-width:600px;text-align:center}
  #iKicker{font-size:10px;letter-spacing:.52em;color:rgba(244,238,228,.46);margin-bottom:22px}
  #iTitle{font-family:var(--serif);font-size:clamp(26px,4vw,42px);letter-spacing:.1em;margin:0 0 18px;color:#fff}
  #iMeta{font-size:11.5px;letter-spacing:.22em;color:rgba(217,182,120,.88);margin-bottom:26px}
  #iLead{font-family:var(--serif);font-size:clamp(14px,1.5vw,16.5px);line-height:2.15;
    color:rgba(244,238,228,.84);margin:0 0 26px}
  #iRule{font-size:11.5px;line-height:2;color:var(--dim2);border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);padding:14px 0;margin:0 0 30px;text-align:left}
  #iRule b{color:rgba(244,238,228,.72);font-weight:500}
  .big-btn{font:inherit;font-family:var(--serif);font-size:13.5px;letter-spacing:.3em;color:#fff;cursor:pointer;
    background:rgba(150,42,32,.24);border:1px solid rgba(192,57,43,.6);border-radius:2px;
    padding:13px 34px;transition:.22s}
  .big-btn:hover{background:rgba(192,57,43,.42);border-color:rgba(214,90,70,.9);
    box-shadow:0 0 0 3px rgba(192,57,43,.12)}
  #intro .foot{margin-top:22px;font-size:10.5px;line-height:1.9;color:rgba(244,238,228,.34)}

  #end{background:linear-gradient(180deg,rgba(5,6,8,.955),rgba(4,5,7,.995))}
  #end .box{max-width:760px;width:100%}
  #eKind{font-size:10px;letter-spacing:.5em;color:rgba(217,182,120,.8);margin-bottom:16px}
  #eTitle{font-family:var(--serif);font-size:clamp(24px,3.6vw,36px);letter-spacing:.06em;margin:0 0 16px;color:#fff}
  #eSub{font-family:var(--serif);font-size:clamp(13.5px,1.4vw,15.5px);line-height:2;color:rgba(244,238,228,.72);margin:0 0 26px}
  .cols{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);margin-bottom:24px}
  .cols .row{background:#0a0c0f;padding:14px 16px}
  .cols .k{font-size:10px;letter-spacing:.22em;color:rgba(217,182,120,.8);margin-bottom:7px}
  .cols .v{font-size:12.5px;line-height:1.95;color:rgba(244,238,228,.78)}
  #eTrail{font-size:11.5px;line-height:2;color:var(--dim);margin-bottom:24px;
    border-left:2px solid rgba(244,238,228,.14);padding-left:14px}
  #eTrail span{color:rgba(244,238,228,.42);margin-right:8px;font-variant-numeric:tabular-nums}
  #eGain{font-size:11.5px;letter-spacing:.1em;color:rgba(217,182,120,.9);margin-bottom:26px}
  #end .acts{display:flex;gap:10px;flex-wrap:wrap}
  .ghost{font:inherit;font-size:11.5px;letter-spacing:.16em;color:var(--dim);cursor:pointer;
    background:rgba(10,12,15,.5);border:1px solid var(--line);border-radius:2px;padding:11px 18px;transition:.2s}
  .ghost:hover{color:var(--ink);border-color:rgba(244,238,228,.4)}
  .ghost.primary{color:#fff;background:rgba(150,42,32,.26);border-color:rgba(192,57,43,.6)}
  .ghost.primary:hover{background:rgba(192,57,43,.44)}

  #toast{position:fixed;left:50%;top:clamp(84px,13vh,132px);transform:translate(-50%,-8px);z-index:35;
    font-family:var(--serif);font-size:clamp(13px,1.4vw,15px);letter-spacing:.1em;color:#fff;
    background:rgba(8,10,13,.82);border:1px solid rgba(217,182,120,.4);border-radius:2px;
    padding:10px 18px;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;max-width:84vw;
    text-align:center;backdrop-filter:blur(8px)}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #toast b{color:var(--gold);font-weight:500}

  /* ================= 探 索 =================
     进站之后先站到那块地方上：画面比屏幕大，拖着看，
     亮着的点是人、是物、是没写在地图上的岔路。 */
  body.explore #stageOuter{cursor:grab}
  body.dragging,body.dragging #stageOuter{cursor:grabbing}
  body.explore #deck{opacity:0!important;pointer-events:none}
  body.explore #hint{visibility:visible}
  /* 要看清人在哪儿 —— 剧情模式靠文字，探索模式靠眼睛。
     亮度挂在 .bg 上而不是 #bgWrap 上：filter 会把这层压成平面，
     挂在外层就和 3D 深度排序打架。 */
  body.explore .bg{filter:brightness(1.34) contrast(1.04) saturate(1.06);
    transition:filter .9s ease}
  body.explore #shade{opacity:.64;transition:opacity .9s ease}
  body.explore #vig{opacity:.70;transition:opacity .9s ease}
  body.explore #tint{opacity:.48!important}
  /* 对着谁说话，就只留那一个点 —— 其余收起来，画面不打架。
     名字也不再重复一遍（气泡头上已经写了），那个点也不该亮得像贴在脸上的灯。 */
  body.inenc #spots .spot{opacity:0;pointer-events:none}
  body.inenc #spots .spot.hi{opacity:1}
  body.inenc #spots .spot .lb{opacity:0}
  body.inenc #spots .spot.hi i{transform:scale(.62);opacity:.5;animation:none}
  body.inenc #spots .spot.hi::before{display:none}

  #spots{position:fixed;inset:0;z-index:18;pointer-events:none;overflow:hidden;
    transition:opacity .4s}
  .spot{position:absolute;left:0;top:0;width:38px;height:38px;padding:0;margin:0;
    display:grid;place-items:center;pointer-events:auto;cursor:pointer;
    background:none;border:0;transition:opacity .5s}
  .spot i{display:block;width:7px;height:7px;border-radius:50%;
    background:rgba(250,224,176,.98);
    box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 0 2px rgba(240,208,150,.55),
      0 0 16px 4px rgba(240,190,110,.60);
    animation:sp 2.9s ease-in-out infinite}
  @keyframes sp{0%,100%{opacity:.52;transform:scale(.86)}50%{opacity:1;transform:scale(1.14)}}
  /* 一圈慢慢散开的水纹：光靠一个点，人不知道它是能点的 */
  .spot::before{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;
    margin:-4.5px 0 0 -4.5px;border-radius:50%;
    border:1px solid rgba(240,208,150,.55);
    animation:spPing 3.4s ease-out infinite;animation-delay:var(--pd,0s);pointer-events:none}
  @keyframes spPing{0%{transform:scale(.5);opacity:.85}62%{transform:scale(3.6);opacity:0}100%{opacity:0}}
  .spot::after{content:"";position:absolute;left:50%;top:50%;width:17px;height:17px;
    margin:-8.5px 0 0 -8.5px;border-radius:50%;border:1px solid rgba(233,199,138,.14);
    transition:width .3s,height .3s,margin .3s,border-color .3s;pointer-events:none}
  .spot.near::after,.spot:hover::after,.spot.hi::after{
    width:23px;height:23px;margin:-11.5px 0 0 -11.5px;border-color:rgba(233,199,138,.38)}
  .spot.cast i{width:10px;height:10px;background:rgba(255,240,212,1);
    box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 0 2px rgba(255,236,204,.62),
      0 0 22px 5px rgba(255,200,130,.66)}
  .spot.fork i{width:0;height:0;border-radius:0;background:none;box-shadow:none;
    border-left:5px solid transparent;border-right:5px solid transparent;
    border-bottom:9px solid rgba(214,142,112,.95);animation:sp 2.2s ease-in-out infinite}
  .spot.fork::after,.spot.fork::before{display:none}
  .spot .lb{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;
    font-size:10px;letter-spacing:.14em;color:rgba(250,244,232,.80);
    background:rgba(6,8,11,.52);border-radius:2px;padding:3px 7px 4px;margin-top:3px;
    text-shadow:0 1px 6px #000;backdrop-filter:blur(2px);
    opacity:0;transition:opacity .3s;pointer-events:none}
  .spot.near .lb,.spot:hover .lb,.spot.hi .lb{opacity:1}
  .spot.top .lb{display:none}
  .spot.top.near i{opacity:.6}
  /* 刚进来的时候先亮一下名字，让人知道这里有东西，然后收起来 */
  #spots.peek .spot:not(.hidden) .lb{opacity:1}
  /* 岔路不写名字 —— 看见的只是一个三角 */
  .spot.fork .lb{display:none}
  .spot.hi i{animation:none;transform:scale(1.6);opacity:1}
  .spot.seen{opacity:.40}
  .spot.seen i{animation:none;opacity:.55;box-shadow:0 0 0 1px rgba(233,199,138,.14)}
  .spot.seen::after{display:none}
  .spot.hidden i{opacity:.14;box-shadow:none;background:rgba(255,240,220,.5)}
  .spot.hidden.near i{opacity:.55;box-shadow:0 0 12px 1px rgba(255,214,160,.32)}
  .spot.hidden .lb{color:rgba(244,238,228,.45);font-style:italic}
  .spot.far{opacity:0!important;pointer-events:none}
  .spot:focus-visible{outline:0}
  .spot:focus-visible .lb{opacity:1}
  @media (prefers-reduced-motion: reduce){.spot i{animation:none}.spot::before{display:none}}

  /* 那边还有东西 —— 屏幕边上一道很淡的提示 */
  .edge{position:fixed;top:44%;z-index:19;pointer-events:none;visibility:hidden;
    font-family:var(--serif);font-size:22px;line-height:1;color:rgba(233,199,138,.55);
    text-shadow:0 1px 10px #000;animation:eg 2.6s ease-in-out infinite}
  .edge.on{visibility:visible}
  #edgeL{left:15px}
  #edgeR{right:15px}
  @keyframes eg{0%,100%{opacity:.16;transform:translateX(0)}50%{opacity:.62;transform:translateX(2px)}}

  /* 底部提示：还剩几处没看，以及「往下走」的出口 */
  #hint{position:fixed;left:0;right:0;bottom:clamp(26px,4.4vh,46px);z-index:21;
    padding:0 clamp(18px,6vw,96px);max-width:min(720px,94vw);
    opacity:0;transform:translateY(10px);transition:opacity .7s,transform .7s;
    pointer-events:none;visibility:hidden}
  #hint.on{opacity:1;transform:none;visibility:visible}
  #hint .ln{font-family:var(--serif);font-size:clamp(12.5px,1.2vw,14.5px);line-height:1.9;
    letter-spacing:.08em;color:rgba(248,243,234,.60);text-shadow:0 1px 14px rgba(0,0,0,.98)}
  #hint .ln b{color:rgba(233,199,138,.92);font-weight:500}
  #hint .dots{margin-top:11px;display:flex;gap:6px;align-items:center}
  #hint .dots i{width:5px;height:5px;border-radius:50%;background:rgba(244,238,228,.22)}
  #hint .dots i.g{background:rgba(233,199,138,.9);box-shadow:0 0 8px 1px rgba(233,199,138,.45)}
  #hint .dots span{margin-left:9px;font-size:10px;letter-spacing:.16em;color:rgba(244,238,228,.32)}
  #hint .go{margin-top:16px;pointer-events:auto}

  /* 对话：不再从底下推上来一整块（那看着像「进了一个新页面」），
     而是贴着那个人开一个小气泡。位置由 explore.js 每帧按热点投影算，
     这里只管长相。--bx/--by 是气泡左上角，--ay 是那个小三角对着的高度。 */
  #enc{position:fixed;left:0;right:0;bottom:0;z-index:26;
    padding:0 clamp(18px,6vw,96px) clamp(34px,5vh,54px);
    max-width:min(780px,94vw);opacity:0;transform:translateY(16px);
    transition:opacity .45s,transform .45s cubic-bezier(.3,.8,.3,1);pointer-events:none}
  #enc.on{opacity:1;transform:none;pointer-events:auto}
  #enc::before{content:"";position:fixed;left:0;right:0;bottom:0;height:62vh;z-index:-1;
    pointer-events:none;background:linear-gradient(180deg,rgba(4,5,7,0) 0%,
      rgba(4,5,7,.60) 42%,rgba(4,5,7,.90) 74%,rgba(4,5,7,.97) 100%)}
  #encWho{font-family:var(--serif);font-size:11px;letter-spacing:.26em;
    color:rgba(233,199,138,.92);margin-bottom:13px;display:flex;gap:11px;align-items:baseline;
    text-shadow:0 1px 10px rgba(0,0,0,.95)}
  #encWho em{font-style:normal;color:rgba(244,238,228,.30);letter-spacing:.2em;font-size:9.5px}
  #encTxt{font-family:var(--serif);font-size:clamp(14.5px,1.38vw,17.5px);line-height:2.1;
    letter-spacing:.045em;color:rgba(248,243,234,.95);
    text-shadow:0 1px 20px rgba(0,0,0,.95),0 0 44px rgba(0,0,0,.6);
    max-height:40vh;overflow-y:auto;overscroll-behavior:contain}
  #encTxt::-webkit-scrollbar{width:2px}
  #encTxt::-webkit-scrollbar-thumb{background:rgba(244,238,228,.14)}
  #encTxt p{margin:0 0 .62em;animation:enIn .5s ease both}
  #encTxt p:last-child{margin-bottom:0}
  @keyframes enIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  #encOpts{margin-top:15px;display:flex;flex-direction:column;gap:1px}
  #encFoot{margin-top:14px;font-size:9.5px;letter-spacing:.18em;color:rgba(244,238,228,.34)}

  /* ---- 就地对话：一张贴在人身旁的小卡 ---- */
  #enc.bub{left:var(--bx,40px);top:var(--by,140px);right:auto;bottom:auto;
    width:min(372px,42vw);max-width:min(372px,42vw);
    padding:14px 16px 11px;border-radius:2px;
    background:linear-gradient(180deg,rgba(11,13,16,.88),rgba(7,8,10,.945));
    border:1px solid rgba(217,182,120,.26);
    box-shadow:0 28px 66px -32px #000,inset 0 0 0 1px rgba(244,238,228,.045);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transform:translateY(5px);transition:opacity .26s ease,transform .26s cubic-bezier(.2,.8,.3,1)}
  #enc.bub.on{transform:none}
  #enc.bub.away{opacity:.34}
  #enc.bub::before{display:none}
  #enc.bub::after{content:"";position:absolute;top:var(--ay,34px);margin-top:-7px;
    width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent}
  #enc.bub.lft::after{left:-8px;border-right:8px solid rgba(9,11,14,.92)}
  #enc.bub.rgt::after{right:-8px;border-left:8px solid rgba(9,11,14,.92)}
  #enc.bub #encWho{font-size:9.5px;letter-spacing:.24em;margin-bottom:8px;gap:9px}
  #enc.bub #encWho em{font-size:9px}
  #enc.bub #encTxt{font-size:clamp(12.5px,1.02vw,14.6px);line-height:1.92;max-height:44vh;
    letter-spacing:.03em}
  #enc.bub #encOpts{margin-top:11px}
  #enc.bub #encFoot{margin-top:9px;font-size:9px;letter-spacing:.16em}
  #enc.bub .ch{padding:9px 11px 9px 10px;font-size:clamp(12px,1vw,13.6px);line-height:1.6;
    background:rgba(255,255,255,.03);border-left-color:rgba(233,199,138,.34)}
  #enc.bub .ch .n{font-size:10.5px;padding-top:1px}
  #enc.bub .ch:hover{background:rgba(150,42,32,.22);transform:translateX(2px)}
  /* 窄屏：气泡放不下就退回底部一条，但仍然不是「一整个页面」 */
  @media (max-width:720px){
    #enc.bub{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-width:none}
    #enc.bub::after{display:none}
    #enc.bub #encTxt{max-height:38vh}
  }

  /* 成就 */
  #achPop{position:fixed;left:50%;top:clamp(72px,11vh,112px);z-index:36;
    transform:translate(-50%,-14px);opacity:0;pointer-events:none;
    transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.3,1);
    background:linear-gradient(180deg,rgba(26,20,13,.95),rgba(11,9,7,.97));
    border:1px solid rgba(217,182,120,.44);border-radius:2px;
    padding:14px 26px 15px;text-align:center;backdrop-filter:blur(12px);
    box-shadow:0 20px 54px -24px #000,inset 0 0 0 1px rgba(217,182,120,.09)}
  #achPop.on{opacity:1;transform:translate(-50%,0)}
  #achPop .k{font-size:9px;letter-spacing:.52em;color:rgba(217,182,120,.82);margin-bottom:8px}
  #achPop .n{font-family:var(--serif);font-size:15.5px;letter-spacing:.16em;color:#fff}
  #achPop .d{margin-top:7px;font-size:10px;letter-spacing:.06em;color:rgba(244,238,228,.46)}

  /* 抽屉里的成就 */
  .achrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
    border-top:1px solid rgba(244,238,228,.07);font-size:11.5px;letter-spacing:.04em}
  .achrow:first-of-type{border-top:0}
  .achrow .a{color:rgba(233,199,138,.92);font-family:var(--serif);letter-spacing:.1em}
  .achrow .b{color:rgba(244,238,228,.40);text-align:right;font-size:10.5px}

  @media (max-width:720px){
    #flags{display:none}
    #achPop{top:clamp(150px,20vh,230px);padding:12px 20px 13px}
    #achPop .n{font-size:14px}
    #hint .ln{font-size:12.5px;line-height:1.85}
    #encTxt{max-height:34vh}
    #stam{margin-top:10px}
    #deck{padding:0 18px 26px;max-width:100%}
    #text{font-size:15px;line-height:2}
    .hud-l .p,.hud-l .d{font-size:10px}
    .hud-r button{padding:6px 9px;font-size:10.5px}
    #choices{max-width:100%}
  }
</style>
</head>
<body>

<div id="stageOuter">
  <div id="stage">
    <div id="paneFar"></div>
    <div id="depthA"></div>
    <div id="bgWrap">
      <div class="bg" id="bg0"></div>
      <div class="bg" id="bg1"></div>
    </div>
    <div id="paneNear"></div>
  </div>
</div>
<div id="spots"></div>
<div class="edge" id="edgeL">‹</div>
<div class="edge" id="edgeR">›</div>
<div id="tint"></div>
<div id="shade"></div>
<div id="vig"></div>
<div id="grain"></div>
<div id="flash"></div>

<div id="hud">

  <div class="hud-l">
    <div class="t"><span id="hTitle">—</span><span id="hTag"></span></div>
    <div class="p" id="hPlace">—</div>
    <div class="d" id="hClock">—</div>
    <div class="d walk" id="hWalk">—</div>
    <div class="d walk" id="hPanoCredit">AI 历史场景复原</div>
    <div id="stam"><span>体 力</span><div id="stamBarWrap"><i id="stamBar"></i></div><span id="stamNum">—</span></div>
    <div id="flags"></div>
    <div id="mate"></div>
  </div>
  <div class="hud-r">
    <button id="bArch">档案 <b id="bArchN">0/0</b></button>
    <button id="bSnd">声音</button>
    <button id="bExit">离开</button>
  </div>
</div>

<main id="deck">
  <div id="text"></div>
  <div id="choices"></div>
</main>

<aside id="drawer" inert>
  <button id="drClose" aria-label="关闭">×</button>
  <h3 id="drHead">档 案</h3>
  <div id="drSub">—</div>
  <div id="drBody"></div>
